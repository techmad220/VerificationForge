name: Format language expansion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/expand-js-c-families'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-js-c-families
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply canonical rustfmt and push
        shell: bash
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/verificationforge-adapter-js-family/src/lib.rs crates/verificationforge-adapter-c-family/src/lib.rs
          git commit -m "Apply rustfmt to language family adapters"
          git push origin HEAD:agent/expand-js-c-families
