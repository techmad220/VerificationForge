name: Branch Checkpoint Rust edit

on:
  push:
    branches:
      - agent/complete-checkpoint-gate

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-checkpoint-gate
      - name: Apply exact Rust checkpoint adapter edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/verificationforge-adapter-rust/src/lib.rs')
          text = path.read_text()

          old_methods = '''    fn run_targeted_tests(
              &self,
              repo: &Path,
              execution: &dyn ExecutionAdapter,
              scope: &ImpactScope,
          ) -> CheckResult {
              run_targeted_rust_tests(execution, repo, scope)
          }

          fn run_check(
          '''
          new_methods = '''    fn run_targeted_tests(
              &self,
              repo: &Path,
              execution: &dyn ExecutionAdapter,
              scope: &ImpactScope,
          ) -> CheckResult {
              run_targeted_rust_tests(execution, repo, scope)
          }

          fn run_integration_tests(
              &self,
              repo: &Path,
              execution: &dyn ExecutionAdapter,
              scope: &ImpactScope,
          ) -> CheckResult {
              run_checkpoint_integration_tests(execution, repo, scope)
          }

          fn run_property_tests(
              &self,
              repo: &Path,
              execution: &dyn ExecutionAdapter,
              scope: &ImpactScope,
          ) -> CheckResult {
              run_checkpoint_property_tests(execution, repo, scope)
          }

          fn run_ui_verification(
              &self,
              repo: &Path,
              execution: &dyn ExecutionAdapter,
              scope: &ImpactScope,
          ) -> CheckResult {
              if !scope_has_ui_surface(repo, scope) {
                  return CheckResult::skipped(
                      "rust:checkpoint-ui",
                      "no affected Rust/UI surface was detected for this checkpoint",
                  );
              }
              run_repository_harness(
                  repo,
                  execution,
                  "rust:checkpoint-ui",
                  "checkpoint-ui",
              )
              .unwrap_or_else(|| {
                  CheckResult::unsupported(
                      "rust:checkpoint-ui",
                      "affected UI surface detected but .verificationforge/checkpoint-ui.argv is missing",
                  )
              })
          }

          fn run_api_verification(
              &self,
              repo: &Path,
              execution: &dyn ExecutionAdapter,
              scope: &ImpactScope,
          ) -> CheckResult {
              if !scope_has_api_surface(repo, scope) {
                  return CheckResult::skipped(
                      "rust:checkpoint-api",
                      "no affected API/protocol surface was detected for this checkpoint",
                  );
              }
              run_repository_harness(
                  repo,
                  execution,
                  "rust:checkpoint-api",
                  "checkpoint-api",
              )
              .unwrap_or_else(|| {
                  CheckResult::unsupported(
                      "rust:checkpoint-api",
                      "affected API surface detected but .verificationforge/checkpoint-api.argv is missing",
                  )
              })
          }

          fn run_check(
          '''
          if text.count(old_methods) != 1:
              raise SystemExit('checkpoint method anchor mismatch')
          text = text.replace(old_methods, new_methods, 1)

          helpers = r'''fn checkpoint_target_paths(scope: &ImpactScope) -> BTreeSet<String> {
              let mut paths = scope.changed_paths.clone();
              for symbol in &scope.affected_symbols {
                  if let Some(path) = symbol.0.strip_prefix("rust:file:") {
                      paths.insert(path.to_owned());
                  }
              }
              paths
          }

          fn rust_package_info_for_path(repo: &Path, relative: &str) -> Option<(String, PathBuf)> {
              let absolute = repo.join(relative);
              let mut directory = if absolute.is_dir() {
                  absolute
              } else {
                  absolute.parent()?.to_path_buf()
              };
              loop {
                  let manifest = directory.join("Cargo.toml");
                  if manifest.is_file()
                      && let Ok(content) = fs::read_to_string(&manifest)
                      && let Some(name) = cargo_package_name(&content)
                  {
                      return Some((name, directory));
                  }
                  if directory == repo {
                      break;
                  }
                  let parent = directory.parent()?;
                  if !parent.starts_with(repo) {
                      break;
                  }
                  directory = parent.to_path_buf();
              }
              None
          }

          fn checkpoint_packages(
              repo: &Path,
              scope: &ImpactScope,
          ) -> Option<BTreeSet<(String, PathBuf)>> {
              let mut packages = BTreeSet::new();
              for path in checkpoint_target_paths(scope) {
                  packages.insert(rust_package_info_for_path(repo, &path)?);
              }
              (!packages.is_empty()).then_some(packages)
          }

          fn package_has_integration_tests(root: &Path) -> bool {
              !source_files(&root.join("tests"), "rs").is_empty()
          }

          fn source_has_property_markers(root: &Path) -> bool {
              source_files(root, "rs").iter().any(|path| {
                  fs::read_to_string(path).is_ok_and(|content| {
                      [
                          "proptest!",
                          "quickcheck!",
                          "#[quickcheck]",
                          "fn property_",
                          "fn prop_",
                      ]
                      .iter()
                      .any(|marker| content.contains(marker))
                  })
              })
          }

          fn run_checkpoint_integration_tests(
              execution: &dyn ExecutionAdapter,
              repo: &Path,
              scope: &ImpactScope,
          ) -> CheckResult {
              if scope.requires_full_verification {
                  if !source_files(&repo.join("tests"), "rs").is_empty()
                      || source_files(repo, "rs").iter().any(|path| {
                          path.components().any(|part| part.as_os_str() == "tests")
                      })
                  {
                      return run_named_command(
                          execution,
                          repo,
                          "rust:checkpoint-integration",
                          "cargo",
                          &["test", "--workspace", "--tests", "--locked"],
                      );
                  }
                  return CheckResult::unsupported(
                      "rust:checkpoint-integration",
                      "checkpoint requires integration tests but no Rust integration-test target was discovered",
                  );
              }

              let Some(packages) = checkpoint_packages(repo, scope) else {
                  return CheckResult::unsupported(
                      "rust:checkpoint-integration",
                      "affected Rust packages could not be mapped for integration verification",
                  );
              };
              for (package, root) in &packages {
                  if !package_has_integration_tests(root) {
                      return CheckResult::unsupported(
                          "rust:checkpoint-integration",
                          format!("affected package {package} has no integration-test target"),
                      );
                  }
                  let args = vec![
                      "test".to_owned(),
                      "--package".to_owned(),
                      package.clone(),
                      "--tests".to_owned(),
                      "--locked".to_owned(),
                  ];
                  match execution.execute("cargo", &args, repo) {
                      Ok(output) if output.success() => {}
                      Ok(output) => {
                          return CheckResult::fail(
                              "rust:checkpoint-integration",
                              "VF_CHECKPOINT_INTEGRATION_FAILED",
                              format!(
                                  "cargo integration tests for {package} exited with code {}: {}",
                                  output.exit_code,
                                  if output.stderr.trim().is_empty() {
                                      output.stdout.trim()
                                  } else {
                                      output.stderr.trim()
                                  }
                              ),
                          );
                      }
                      Err(error) => {
                          return CheckResult::fail(
                              "rust:checkpoint-integration",
                              "VF_EXECUTION_FAILED",
                              error,
                          );
                      }
                  }
              }
              CheckResult::pass_with_evidence(
                  "rust:checkpoint-integration",
                  format!(
                      "affected Rust integration tests passed packages={}",
                      packages
                          .iter()
                          .map(|(name, _)| name.as_str())
                          .collect::<Vec<_>>()
                          .join(",")
                  ),
              )
          }

          fn run_checkpoint_property_tests(
              execution: &dyn ExecutionAdapter,
              repo: &Path,
              scope: &ImpactScope,
          ) -> CheckResult {
              if scope.requires_full_verification {
                  if !source_has_property_markers(repo) {
                      return CheckResult::unsupported(
                          "rust:checkpoint-property",
                          "checkpoint requires property verification but no Rust property-test markers were discovered",
                      );
                  }
                  return run_named_command(
                      execution,
                      repo,
                      "rust:checkpoint-property",
                      "cargo",
                      &["test", "--workspace", "--all-targets", "--locked"],
                  );
              }

              let Some(packages) = checkpoint_packages(repo, scope) else {
                  return CheckResult::unsupported(
                      "rust:checkpoint-property",
                      "affected Rust packages could not be mapped for property verification",
                  );
              };
              for (package, root) in &packages {
                  if !source_has_property_markers(root) {
                      return CheckResult::unsupported(
                          "rust:checkpoint-property",
                          format!("affected package {package} has no property-test marker"),
                      );
                  }
                  let args = vec![
                      "test".to_owned(),
                      "--package".to_owned(),
                      package.clone(),
                      "--all-targets".to_owned(),
                      "--locked".to_owned(),
                  ];
                  match execution.execute("cargo", &args, repo) {
                      Ok(output) if output.success() => {}
                      Ok(output) => {
                          return CheckResult::fail(
                              "rust:checkpoint-property",
                              "VF_CHECKPOINT_PROPERTY_FAILED",
                              format!(
                                  "cargo property verification for {package} exited with code {}: {}",
                                  output.exit_code,
                                  if output.stderr.trim().is_empty() {
                                      output.stdout.trim()
                                  } else {
                                      output.stderr.trim()
                                  }
                              ),
                          );
                      }
                      Err(error) => {
                          return CheckResult::fail(
                              "rust:checkpoint-property",
                              "VF_EXECUTION_FAILED",
                              error,
                          );
                      }
                  }
              }
              CheckResult::pass_with_evidence(
                  "rust:checkpoint-property",
                  format!(
                      "affected Rust property verification passed packages={}",
                      packages
                          .iter()
                          .map(|(name, _)| name.as_str())
                          .collect::<Vec<_>>()
                          .join(",")
                  ),
              )
          }

          fn scope_has_ui_surface(repo: &Path, scope: &ImpactScope) -> bool {
              if scope.requires_full_verification {
                  return has_ui_assets(repo);
              }
              checkpoint_target_paths(scope).iter().any(|relative| {
                  let path = Path::new(relative);
                  let extension = path
                      .extension()
                      .and_then(|value| value.to_str())
                      .unwrap_or_default();
                  if ["html", "css", "js", "ts", "tsx", "jsx"].contains(&extension)
                      || ["ui", "web", "frontend", "templates", "static"]
                          .iter()
                          .any(|part| path.components().any(|item| item.as_os_str() == *part))
                  {
                      return true;
                  }
                  extension == "rs"
                      && fs::read_to_string(repo.join(relative)).is_ok_and(|content| {
                          [
                              "yew::", "leptos::", "dioxus::", "egui::", "iced::", "tauri::",
                          ]
                          .iter()
                          .any(|marker| content.contains(marker))
                      })
              })
          }

          fn scope_has_api_surface(repo: &Path, scope: &ImpactScope) -> bool {
              let markers = [
                  "axum::",
                  "actix_web::",
                  "rocket::",
                  "warp::",
                  "tonic::",
                  "jsonrpsee",
                  "Router::new",
                  "TcpListener",
                  "#[get(",
                  "#[post(",
                  "utoipa::",
              ];
              let paths = if scope.requires_full_verification {
                  source_files(repo, "rs")
                      .into_iter()
                      .map(|path| display_relative(repo, &path))
                      .collect::<BTreeSet<_>>()
              } else {
                  checkpoint_target_paths(scope)
              };
              paths.iter().any(|relative| {
                  let lower = relative.to_ascii_lowercase();
                  if lower.ends_with(".proto")
                      || lower.contains("openapi")
                      || lower.contains("swagger")
                  {
                      return true;
                  }
                  Path::new(relative).extension().and_then(|value| value.to_str()) == Some("rs")
                      && fs::read_to_string(repo.join(relative)).is_ok_and(|content| {
                          markers.iter().any(|marker| content.contains(marker))
                      })
              })
          }

          '''
          anchor = 'fn optional_cargo_tool('
          if text.count(anchor) != 1:
              raise SystemExit('checkpoint helper anchor mismatch')
          text = text.replace(anchor, helpers + anchor, 1)
          path.write_text(text)
          PY
      - name: Commit exact adapter edit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/verificationforge-adapter-rust/src/lib.rs
          git commit -m "Implement native Rust Checkpoint verification hooks"
          git push origin HEAD:agent/complete-checkpoint-gate
