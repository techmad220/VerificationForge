name: Patch Popular Language CI

on:
  push:
    branches:
      - agent/expand-popular-languages

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-popular-languages
          fetch-depth: 0
      - name: Replace deprecated Gleam setup action
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/popular-language-family-ci.yml')
          text = path.read_text()
          old = "      - uses: gleam-lang/setup-gleam@v1\n"
          new = "      - uses: erlef/setup-beam@v1.24.1\n        with:\n          otp-version: '27'\n          gleam-version: '1.9.0'\n"
          if old not in text:
              raise SystemExit('expected Gleam setup line not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-popular-ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/popular-language-family-ci.yml
          git add -u .github/workflows/patch-popular-ci.yml
          git commit -m "Fix Gleam CI toolchain setup"
          git push origin HEAD:agent/expand-popular-languages
