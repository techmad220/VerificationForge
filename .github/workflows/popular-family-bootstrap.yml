name: Popular Family Bootstrap

on:
  push:
    branches:
      - agent/expand-popular-languages

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-popular-languages
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Canonicalize and verify Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets --locked
      - name: Commit canonical form and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/popular-family-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock . ':!.github/workflows/popular-family-bootstrap.yml'
          git add -u .github/workflows/popular-family-bootstrap.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Canonicalize popular language family"
          git push origin HEAD:agent/expand-popular-languages
