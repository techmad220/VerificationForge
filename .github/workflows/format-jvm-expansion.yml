name: Format JVM expansion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/expand-jvm-family'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-jvm-family
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply canonical rustfmt and push
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/verificationforge-adapter-jvm-family/src/lib.rs apps/verificationforge-cli/src/main.rs
          git commit -m "Apply rustfmt to JVM family adapter"
          git push origin HEAD:agent/expand-jvm-family
