name: Branch checkpoint clippy fix

on:
  push:
    branches:
      - agent/complete-checkpoint-gate

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-checkpoint-gate
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Move test-only import and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/verificationforge-adapter-rust/src/checkpoint.rs')
          text = path.read_text()
          old = '    CheckResult, ExecutionAdapter, ImpactScope, SymbolId, run_repository_harness,\n'
          new = '    CheckResult, ExecutionAdapter, ImpactScope, run_repository_harness,\n'
          if text.count(old) != 1:
              raise SystemExit('top-level SymbolId import anchor mismatch')
          text = text.replace(old, new, 1)
          test_anchor = 'mod tests {\n    use super::*;\n'
          if text.count(test_anchor) != 1:
              raise SystemExit('test module anchor mismatch')
          text = text.replace(
              test_anchor,
              test_anchor + '    use verificationforge_core::SymbolId;\n',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit Clippy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/verificationforge-adapter-rust/src/checkpoint.rs
          git commit -m "Fix Checkpoint adapter test-only import"
          git push origin HEAD:agent/complete-checkpoint-gate
