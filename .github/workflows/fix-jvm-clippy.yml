name: Fix JVM Clippy

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/expand-jvm-family'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-jvm-family
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply Clippy fix and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/verificationforge-adapter-jvm-family/src/lib.rs')
          text = path.read_text()
          old = '''            if matches!(language, JvmLanguage::Java) {\n                if let Some(name) = java_method_name(trimmed) {\n                    symbols.push(SymbolId(format!(\n                        "{}:method:{relative}:{name}",\n                        language.id()\n                    )));\n                }\n            }\n'''
          new = '''            if matches!(language, JvmLanguage::Java)\n                && let Some(name) = java_method_name(trimmed)\n            {\n                symbols.push(SymbolId(format!(\n                    "{}:method:{relative}:{name}",\n                    language.id()\n                )));\n            }\n'''
          if old not in text:
              raise SystemExit('expected Clippy target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/verificationforge-adapter-jvm-family/src/lib.rs
          git commit -m "Fix JVM adapter Clippy warning"
          git push origin HEAD:agent/expand-jvm-family
