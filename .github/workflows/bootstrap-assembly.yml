name: Bootstrap assembly adapter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/expand-assembly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-assembly
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Wire CLI, lock workspace, format, and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/verificationforge-cli/src/main.rs')
          text = path.read_text()
          import_marker = 'use verificationforge_adapter_c_family::{CAdapter, CSharpAdapter, CppAdapter};\n'
          import_line = 'use verificationforge_adapter_assembly::AssemblyAdapter;\n'
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit('CLI import marker missing')
              text = text.replace(import_marker, import_line + import_marker, 1)
          register_marker = '    registry.register(Arc::new(PhpAdapter));\n'
          register_line = '    registry.register(Arc::new(AssemblyAdapter));\n'
          if register_line not in text:
              if register_marker not in text:
                  raise SystemExit('CLI registration marker missing')
              text = text.replace(register_marker, register_marker + register_line, 1)
          path.write_text(text)
          PY
          cargo generate-lockfile
          cargo fmt --all
          git rm .github/workflows/bootstrap-assembly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/verificationforge-cli/src/main.rs Cargo.lock crates/verificationforge-adapter-assembly/src/lib.rs
          git commit -m "Wire native assembly adapter"
          git push origin HEAD:agent/expand-assembly
