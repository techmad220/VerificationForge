name: Promote verified JVM roadmap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'agent/expand-jvm-family'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-jvm-family
      - name: Record verified JVM family and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tracker = Path('docs/MASTER_TRACKER.md')
          text = tracker.read_text()
          replacements = {
              '- [ ] Java\n': '- [x] Java\n',
              '- [ ] Kotlin\n': '- [x] Kotlin\n',
              '- [ ] Scala\n': '- [x] Scala\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing roadmap entry: {old!r}')
              text = text.replace(old, new, 1)

          marker = 'The checked items above are backed by implemented code and CI rather than roadmap intent alone. '
          note = (
              'Java, Kotlin and Scala are now first-class through the native JVM-family adapter crate. '
              'The three adapters detect and inventory their source independently, use compiler-backed parse/build/type/lint checks, '
              'run source-only executable tests, integrate Maven/Gradle/sbt dependency and test paths where present, block placeholder/fake-authorization patterns, '
              'and fail closed to explicit per-language harnesses for advanced checks that cannot be proven generically. '
              'Dedicated JVM CI pins Java 21, Kotlin 2.4.10 and Scala CLI 1.16.0 and passes real zero-dependency Java, Kotlin and Scala fixtures through the public CLI; '
              'the same exact implementation head also passes the complete existing VerificationForge CI including the real CommitGate and CertificationGate proofs. '
          )
          if marker not in text:
              raise SystemExit('verified-notes marker missing')
          text = text.replace(marker, marker + note, 1)
          tracker.write_text(text)

          status = Path('docs/JVM_FAMILY_STATUS.md')
          status.write_text('''# JVM family implementation status\n\nJava, Kotlin, and Scala are verified native first-class VerificationForge adapters. The dedicated JVM-family CI passes real source/test fixtures for all three languages with Java 21, Kotlin 2.4.10, and Scala CLI 1.16.0, and the full VerificationForge regression suite passes on the same implementation head. The master tracker therefore marks exactly Java, Kotlin, and Scala complete for language expansion while broader JVM framework/platform coverage remains separate roadmap work.\n''')
          PY
          git rm .github/workflows/promote-jvm-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MASTER_TRACKER.md docs/JVM_FAMILY_STATUS.md
          git commit -m "Mark JVM family verified in roadmap"
          git push origin HEAD:agent/expand-jvm-family
