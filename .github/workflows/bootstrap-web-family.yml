name: Bootstrap Web Family

on:
  push:
    branches: [agent/expand-web-dev-family]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-web-dev-family
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Repair known lint and canonicalize workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("crates/verificationforge-adapter-web-family/src/lib.rs"); s=p.read_text(); old="    if repo.join(\"node_modules\").is_dir() {\n        if let Some(manager) = package_manager(execution, repo) {\n"; new="    if repo.join(\"node_modules\").is_dir()\n        && let Some(manager) = package_manager(execution, repo)\n    {\n"; assert old in s; s=s.replace(old,new,1); old_close="        }\n    }\n    let manifest_count = ["; assert old_close in s; s=s.replace(old_close,"    }\n    let manifest_count = [",1); p.write_text(s)'
          cargo generate-lockfile
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Commit canonical workspace state and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-web-family.yml
          git config user.name "techmad220"
          git config user.email "143960678+techmad220@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Canonicalize web family workspace state"
          git push origin HEAD:agent/expand-web-dev-family
