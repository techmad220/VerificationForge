name: Bootstrap Web Family

on:
  push:
    branches: [agent/expand-web-dev-family]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-web-dev-family
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Repair known lint and canonicalize workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/verificationforge-adapter-web-family/src/lib.rs")
          text = path.read_text()
          old = '''    if repo.join("node_modules").is_dir() {
              if let Some(manager) = package_manager(execution, repo) {
                  let args = match manager {
                      "npm" => vec!["ls".into(), "--all".into(), "--omit=optional".into()],
                      "pnpm" => vec!["list".into(), "--depth".into(), "Infinity".into()],
                      "yarn" => vec!["list".into(), "--json".into()],
                      "bun" => vec!["pm".into(), "ls".into()],
                      _ => Vec::new(),
                  };
                  return run_specialist_command(
                      repo,
                      execution,
                      "dependencies",
                      manager,
                      args,
                      inventory,
                  );
              }
          }
          '''
          old = old.replace("              ", "        ", 1)
          # Match the source exactly using a simpler direct slice.
          old = '''    if repo.join("node_modules").is_dir() {
        if let Some(manager) = package_manager(execution, repo) {
            let args = match manager {
                "npm" => vec!["ls".into(), "--all".into(), "--omit=optional".into()],
                "pnpm" => vec!["list".into(), "--depth".into(), "Infinity".into()],
                "yarn" => vec!["list".into(), "--json".into()],
                "bun" => vec!["pm".into(), "ls".into()],
                _ => Vec::new(),
            };
            return run_specialist_command(
                repo,
                execution,
                "dependencies",
                manager,
                args,
                inventory,
            );
        }
    }
'''
          new = '''    if repo.join("node_modules").is_dir()
        && let Some(manager) = package_manager(execution, repo)
    {
        let args = match manager {
            "npm" => vec!["ls".into(), "--all".into(), "--omit=optional".into()],
            "pnpm" => vec!["list".into(), "--depth".into(), "Infinity".into()],
            "yarn" => vec!["list".into(), "--json".into()],
            "bun" => vec!["pm".into(), "ls".into()],
            _ => Vec::new(),
        };
        return run_specialist_command(
            repo,
            execution,
            "dependencies",
            manager,
            args,
            inventory,
        );
    }
'''
          if old not in text:
              raise SystemExit("expected dependency inventory block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo generate-lockfile
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Commit canonical workspace state and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-web-family.yml
          git config user.name "techmad220"
          git config user.email "143960678+techmad220@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Canonicalize web family workspace state"
          git push origin HEAD:agent/expand-web-dev-family
